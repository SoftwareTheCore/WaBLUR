<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- WaBLUR Extension Icon: Eye with blur lines on rounded square -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Eye shape -->
  <ellipse cx="64" cy="64" rx="38" ry="24" fill="none" stroke="white" stroke-width="5" opacity="0.95"/>
  <!-- Iris -->
  <circle cx="64" cy="64" r="12" fill="white" opacity="0.95"/>
  <!-- Pupil -->
  <circle cx="64" cy="64" r="5" fill="#128C7E"/>
  <!-- Blur lines (horizontal) -->
  <line x1="20" y1="48" x2="108" y2="48" stroke="white" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="108" y2="80" stroke="white" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="28" y1="56" x2="100" y2="56" stroke="white" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <line x1="28" y1="72" x2="100" y2="72" stroke="white" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
</svg>

